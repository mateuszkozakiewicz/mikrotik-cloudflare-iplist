name: Update Cloudflare IP list

on:
  schedule:
    - cron: "25 21 * * *"
  workflow_dispatch:

env:
  TZ: Europe/Warsaw

jobs:
  update-cloudflare-ips:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Generate Cloudflare IP list
        run: |
          uv run -- cloudflare_ips.py

      - name: Get current date
        id: current-date
        run: |
          echo "date=$(date +%F)" >> "$GITHUB_OUTPUT"

      - uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          commit_message: "Update Cloudflare IP list ${{ steps.current-date.outputs.date }}"
          branch: main
          commit_user_name: GitHub Actions
          commit_user_email: noreply@github.actions.bot
          commit_author: GitHub Actions <noreply@github.actions.bot>
